name: Android Release

# - PR / push ke dev: analyze + test.
# - Push ke main (PR di-merge): build .aab bertanda tangan → upload otomatis ke
#   Google Play track "internal". Naik ke production lewat "Promote release"
#   di Play Console (atau jalankan manual workflow ini dengan track lain).
#
# Versi:
# - versionName diambil dari `version:` di pubspec.yaml (naikkan saat rilis
#   yang berarti, mis. 1.0.1 / 1.1.0).
# - versionCode dihitung otomatis: 1000 + nomor run workflow ini — selalu naik,
#   tidak perlu diubah manual (angka build di pubspec diabaikan di CI).

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      track:
        description: Track Google Play tujuan
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - production

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    environment: internal-testing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Determine version
        id: version
        run: |
          name="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+[:space:]]+).*/\1/')"
          code=$((1000 + ${{ github.run_number }}))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Versi rilis: $name ($code) → track ${{ inputs.track || 'internal' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$PLAY_SERVICE_ACCOUNT"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          chmod 600 android/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=upload\n'
            printf 'storeFile=../upload-keystore.jks\n'
          } > android/key.properties
          chmod 600 android/key.properties
          # Sidik jari sertifikat upload (publik) — harus sama dengan
          # "Upload key certificate" di Play Console → App integrity.
          keytool -list -keystore android/upload-keystore.jks -storepass "$STORE_PASSWORD" -alias upload \
            | grep -i 'SHA-256\|SHA256' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build signed app bundle
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=API_BASE_URL=https://api.mirubanksampah.id/api

      - name: Save app bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: miru-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mirubanksampah.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          tracks: ${{ inputs.track || 'internal' }}
          status: completed

      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties android/app/google-services.json
